<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>후쿠오카 여행</title>

  <!-- MapLibre -->
  <link
    href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css"
    rel="stylesheet"
  >

  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>


  <style>

    :root {
      --bg:#f6f7f9;
      --card:#ffffff;
      --text:#17181a;
      --muted:#74777d;
      --line:#e7e8eb;
      --black:#151515;
      --blue:#2f6fed;
      --green:#23a559;
      --red:#ef5350;
      --orange:#ff8c42;
      --pink:#f06292;
      --purple:#8e61d4;
    }

    * {
      box-sizing:border-box;
    }

    html,
    body {
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
    }

    button,
    input,
    select {
      font:inherit;
    }

    button {
      cursor:pointer;
    }


    /* =========================
       HEADER
    ========================= */

    .top-header {
      position:sticky;
      top:0;
      z-index:500;
      padding:14px 16px 12px;
      background:rgba(255,255,255,.96);
      border-bottom:1px solid var(--line);
      backdrop-filter:blur(12px);
    }

    .top-title {
      font-size:21px;
      font-weight:900;
      margin:0;
    }

    .top-subtitle {
      margin-top:4px;
      color:var(--muted);
      font-size:12px;
    }


    /* =========================
       공통
    ========================= */

    main {
      padding-bottom:85px;
    }

    .view {
      display:none;
    }

    .view.active {
      display:block;
    }

    .page {
      padding:14px;
    }

    .card {
      background:#fff;
      border:1px solid var(--line);
      border-radius:18px;
      padding:15px;
      margin-bottom:12px;
    }

    .section-title {
      font-size:17px;
      font-weight:900;
      margin-bottom:10px;
    }

    .muted {
      color:var(--muted);
      font-size:12px;
    }


    /* =========================
       HOME
    ========================= */

    .hero {
      background:
        linear-gradient(
          135deg,
          #e7f4ff,
          #fff4e8
        );

      border-radius:22px;
      padding:20px;
      margin-bottom:14px;
    }

    .hero-small {
      font-size:13px;
      font-weight:700;
      color:#61656c;
    }

    .hero-title {
      margin-top:5px;
      font-size:25px;
      line-height:1.25;
      font-weight:950;
    }

    .hero-text {
      margin-top:8px;
      font-size:13px;
      color:#62666c;
    }


    .quick-grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:9px;
      margin-top:14px;
    }

    .quick-btn {
      min-height:62px;
      border:0;
      border-radius:16px;
      background:white;
      text-align:left;
      padding:12px;
      box-shadow:0 3px 12px rgba(0,0,0,.05);
    }

    .quick-icon {
      font-size:21px;
      margin-bottom:4px;
    }

    .quick-title {
      font-size:13px;
      font-weight:850;
    }


    /* =========================
       DAY TABS
    ========================= */

    .day-tabs {
      display:flex;
      gap:7px;
      overflow-x:auto;
      padding-bottom:3px;
    }

    .day-tab {
      min-width:76px;
      border:1px solid var(--line);
      background:white;
      border-radius:22px;
      padding:9px 13px;
      font-size:13px;
      font-weight:800;
      white-space:nowrap;
    }

    .day-tab.active {
      background:#171717;
      color:white;
      border-color:#171717;
    }


    /* =========================
       SEARCH
    ========================= */

    .search-area {
      background:#fff;
      padding:10px 12px;
      border-bottom:1px solid var(--line);
    }

    .search-row {
      display:grid;
      grid-template-columns:1fr auto;
      gap:7px;
    }

    .search-input {
      height:46px;
      border:1px solid #d7d9dd;
      border-radius:14px;
      padding:0 13px;
      font-size:16px;
      outline:none;
      width:100%;
    }

    .search-input:focus {
      border-color:#888;
      box-shadow:0 0 0 3px rgba(0,0,0,.05);
    }

    .search-btn {
      border:0;
      border-radius:14px;
      background:#171717;
      color:#fff;
      font-weight:850;
      padding:0 17px;
    }

    .category-row {
      display:flex;
      gap:7px;
      margin-top:8px;
      overflow-x:auto;
    }

    .category-select {
      height:38px;
      border:1px solid #dddfe3;
      background:white;
      border-radius:11px;
      padding:0 10px;
      font-size:13px;
      font-weight:700;
    }

    .google-search-btn {
      height:38px;
      border:1px solid #d8dade;
      border-radius:11px;
      background:#fff;
      padding:0 11px;
      font-size:12px;
      font-weight:750;
      white-space:nowrap;
    }


    /* =========================
       검색 결과
    ========================= */

    .search-results {
      display:none;
      background:#fff;
      border-top:1px solid var(--line);
      max-height:330px;
      overflow-y:auto;
    }

    .search-results.show {
      display:block;
    }

    .result-item {
      padding:12px;
      border-bottom:1px solid var(--line);
    }

    .result-title {
      font-size:14px;
      font-weight:850;
    }

    .result-address {
      margin-top:3px;
      font-size:11px;
      line-height:1.4;
      color:var(--muted);
    }

    .result-buttons {
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      margin-top:9px;
    }

    .small-btn {
      border:1px solid #dadce0;
      background:white;
      border-radius:10px;
      padding:7px 10px;
      min-height:36px;
      font-size:12px;
      font-weight:800;
    }

    .small-btn.dark {
      background:#171717;
      border-color:#171717;
      color:white;
    }

    .small-btn.heart {
      color:#d94b77;
    }


    /* =========================
       MAP
    ========================= */

    .map-wrap {
      position:relative;
      height:59vh;
      min-height:430px;
    }

    #map {
      position:absolute;
      inset:0;
    }

    .map-tools {
      position:absolute;
      top:12px;
      right:12px;
      z-index:10;
      display:flex;
      flex-direction:column;
      gap:7px;
    }

    .map-tool-btn {
      min-height:44px;
      padding:0 12px;
      border:1px solid #ddd;
      border-radius:13px;
      background:rgba(255,255,255,.96);
      box-shadow:0 4px 15px rgba(0,0,0,.13);
      font-size:12px;
      font-weight:850;
    }


    /* =========================
       MARKER
    ========================= */

    .number-marker {
      width:36px;
      height:36px;
      border-radius:18px 18px 18px 5px;
      transform:rotate(-45deg);
      border:3px solid white;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 3px 11px rgba(0,0,0,.3);
    }

    .number-marker span {
      transform:rotate(45deg);
      color:#fff;
      font-size:12px;
      font-weight:950;
    }

    .favorite-marker {
      min-width:35px;
      height:35px;
      border-radius:18px;
      border:3px solid white;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 3px 10px rgba(0,0,0,.25);
      font-size:17px;
    }

    .me-marker {
      width:22px;
      height:22px;
      border-radius:50%;
      background:#3478f6;
      border:4px solid white;
      box-shadow:
        0 0 0 5px rgba(52,120,246,.20),
        0 3px 10px rgba(0,0,0,.2);
    }


    /* =========================
       SCHEDULE
    ========================= */

    .route-item {
      display:grid;
      grid-template-columns:38px minmax(0,1fr) auto;
      gap:8px;
      align-items:center;
      padding:10px;
      background:white;
      border:1px solid var(--line);
      border-radius:14px;
      margin-bottom:7px;
    }

    .route-num {
      width:34px;
      height:34px;
      display:flex;
      justify-content:center;
      align-items:center;
      border-radius:50%;
      color:white;
      background:#171717;
      font-size:13px;
      font-weight:900;
    }

    .route-name {
      font-size:13px;
      font-weight:850;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
    }

    .route-detail {
      margin-top:3px;
      color:var(--muted);
      font-size:11px;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
    }

    .route-actions {
      display:flex;
      gap:4px;
    }

    .route-action {
      width:32px;
      height:32px;
      border:1px solid #dedfe2;
      border-radius:9px;
      background:white;
      font-weight:800;
    }

    .route-action.delete {
      color:#e04444;
    }

    .empty {
      padding:25px 12px;
      border:1px dashed #cfd1d5;
      border-radius:15px;
      text-align:center;
      color:var(--muted);
      font-size:13px;
    }


    /* =========================
       이동옵션
    ========================= */

    .option-grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }

    .option {
      border:1px solid var(--line);
      border-radius:14px;
      padding:10px;
      background:#fff;
    }

    .option-label {
      color:var(--muted);
      font-size:11px;
      margin-bottom:5px;
    }

    .option select {
      width:100%;
      border:0;
      outline:0;
      font-weight:800;
      background:white;
    }

    .check-line {
      min-height:30px;
      display:flex;
      align-items:center;
      gap:7px;
      font-size:13px;
      font-weight:800;
    }

    .check-line input {
      width:18px;
      height:18px;
    }


    /* =========================
       버튼
    ========================= */

    .big-buttons {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:10px;
    }

    .big-btn {
      min-height:48px;
      border-radius:14px;
      border:1px solid #d9dade;
      background:white;
      font-weight:850;
    }

    .big-btn.dark {
      background:#171717;
      color:white;
      border-color:#171717;
    }

    .big-btn.blue {
      background:#3478f6;
      color:#fff;
      border-color:#3478f6;
    }


    /* =========================
       FAVORITES
    ========================= */

    .favorite-card {
      padding:12px;
      border-bottom:1px solid var(--line);
    }

    .favorite-card:last-child {
      border-bottom:0;
    }

    .favorite-name {
      font-size:14px;
      font-weight:850;
    }

    .favorite-category {
      display:inline-block;
      margin-top:5px;
      padding:4px 8px;
      border-radius:10px;
      background:#f2f3f5;
      color:#555;
      font-size:11px;
      font-weight:750;
    }


    /* =========================
       STATUS
    ========================= */

    .status {
      display:none;
      padding:9px 12px;
      font-size:12px;
      background:#eef5ff;
      color:#315886;
      border-bottom:1px solid #dbe8fa;
    }

    .status.show {
      display:block;
    }

    .status.error {
      background:#fff0f0;
      color:#9b3636;
    }


    /* =========================
       BOTTOM NAV
    ========================= */

    .bottom-nav {
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      z-index:1000;

      height:
        calc(
          66px + env(safe-area-inset-bottom)
        );

      padding-bottom:
        env(safe-area-inset-bottom);

      background:rgba(255,255,255,.97);
      border-top:1px solid var(--line);

      display:grid;
      grid-template-columns:
        repeat(4,1fr);

      backdrop-filter:blur(15px);
    }

    .nav-btn {
      border:0;
      background:transparent;
      color:#85878b;
      font-size:11px;
      font-weight:750;
    }

    .nav-icon {
      display:block;
      font-size:21px;
      margin-bottom:2px;
    }

    .nav-btn.active {
      color:#111;
      font-weight:900;
    }


    @media(min-width:800px) {

      main {
        max-width:1000px;
        width:100%;
        margin:auto;
      }

      .map-wrap {
        height:650px;
      }

      .bottom-nav {
        left:50%;
        transform:translateX(-50%);
        max-width:700px;
        border-left:1px solid var(--line);
        border-right:1px solid var(--line);
        border-radius:18px 18px 0 0;
      }

    }

  </style>
</head>



<body>

<header class="top-header">

  <div class="top-title">
    🇯🇵 후쿠오카 여행
  </div>

  <div class="top-subtitle">
    우리 둘만의 여행 지도
  </div>

</header>



<main>


  <!-- ======================
       HOME
  ======================= -->

  <section
    id="homeView"
    class="view active"
  >

    <div class="page">

      <div class="hero">

        <div class="hero-small">
          FUKUOKA TRIP
        </div>

        <div class="hero-title">
          오늘은 어디로<br>
          가볼까? 🇯🇵
        </div>

        <div class="hero-text">
          장소를 검색하고 여행 일정을 만들어봐.
        </div>


        <div class="quick-grid">

          <button
            class="quick-btn"
            data-go="map"
          >

            <div class="quick-icon">
              🔎
            </div>

            <div class="quick-title">
              장소 찾기
            </div>

          </button>


          <button
            class="quick-btn"
            data-go="schedule"
          >

            <div class="quick-icon">
              🗓️
            </div>

            <div class="quick-title">
              일정 보기
            </div>

          </button>


          <button
            class="quick-btn"
            data-go="favorites"
          >

            <div class="quick-icon">
              ❤️
            </div>

            <div class="quick-title">
              찜한 장소
            </div>

          </button>


          <button
            class="quick-btn"
            id="homeMyLocation"
          >

            <div class="quick-icon">
              📍
            </div>

            <div class="quick-title">
              현재 위치
            </div>

          </button>

        </div>

      </div>


      <div class="card">

        <div class="section-title">
          여행 일정
        </div>

        <div
          class="day-tabs"
          data-day-tabs
        ></div>

      </div>


      <div class="card">

        <div class="section-title">
          현재 일정
        </div>

        <div id="homeSchedule"></div>

      </div>

    </div>

  </section>



  <!-- ======================
       MAP
  ======================= -->

  <section
    id="mapView"
    class="view"
  >

    <div class="search-area">

      <div class="search-row">

        <input
          id="searchInput"
          class="search-input"
          type="search"
          placeholder="맛집 · 카페 · 관광지 검색"
        >

        <button
          id="searchBtn"
          class="search-btn"
          type="button"
        >
          검색
        </button>

      </div>


      <div class="category-row">

        <select
          id="categorySelect"
          class="category-select"
        >

          <option value="restaurant">
            🍜 맛집
          </option>

          <option value="cafe">
            ☕ 카페
          </option>

          <option value="shopping">
            🛍️ 쇼핑
          </option>

          <option value="tour">
            📸 관광
          </option>

          <option value="hotel">
            🏨 숙소
          </option>

          <option value="etc">
            📍 기타
          </option>

        </select>


        <button
          id="googleSearchBtn"
          class="google-search-btn"
          type="button"
        >
          Google Maps에서 검색
        </button>

      </div>

    </div>


    <div
      id="searchStatus"
      class="status"
    ></div>


    <div
      id="searchResults"
      class="search-results"
    ></div>


    <div class="map-wrap">

      <div id="map"></div>


      <div class="map-tools">

        <button
          id="myLocationBtn"
          class="map-tool-btn"
        >
          📍 내 위치
        </button>

        <button
          id="fitRouteBtn"
          class="map-tool-btn"
        >
          🧭 일정 보기
        </button>

      </div>

    </div>

  </section>



  <!-- ======================
       SCHEDULE
  ======================= -->

  <section
    id="scheduleView"
    class="view"
  >

    <div class="page">

      <div class="card">

        <div class="section-title">
          여행 일정
        </div>

        <div
          class="day-tabs"
          data-day-tabs
        ></div>

      </div>


      <div class="card">

        <div class="section-title">
          이동 설정
        </div>


        <div class="option-grid">

          <div class="option">

            <div class="option-label">
              이동 방식
            </div>

            <select id="travelMode">

              <option value="walking">
                🚶 도보
              </option>

              <option value="transit">
                🚇 대중교통
              </option>

              <option value="driving">
                🚗 자동차
              </option>

            </select>

          </div>


          <div class="option">

            <div class="option-label">
              출발지
            </div>

            <label class="check-line">

              <input
                id="currentStart"
                type="checkbox"
              >

              현재 위치

            </label>

          </div>

        </div>

      </div>


      <div class="card">

        <div class="section-title">
          방문 순서
        </div>

        <div id="routeList"></div>


        <div class="big-buttons">

          <button
            id="scheduleMapBtn"
            class="big-btn"
          >
            🗺️ 지도에서 보기
          </button>


          <button
            id="googleRouteBtn"
            class="big-btn blue"
          >
            길찾기 시작
          </button>

        </div>

      </div>


      <div
        id="routeStatus"
        class="status"
      ></div>

    </div>

  </section>



  <!-- ======================
       FAVORITES
  ======================= -->

  <section
    id="favoritesView"
    class="view"
  >

    <div class="page">

      <div class="card">

        <div class="section-title">
          ❤️ 찜한 장소
        </div>

        <div id="favoriteList"></div>

      </div>

    </div>

  </section>


</main>



<!-- ======================
     BOTTOM NAV
======================= -->

<nav class="bottom-nav">

  <button
    class="nav-btn active"
    data-view="home"
  >
    <span class="nav-icon">🏠</span>
    홈
  </button>


  <button
    class="nav-btn"
    data-view="map"
  >
    <span class="nav-icon">🗺️</span>
    지도
  </button>


  <button
    class="nav-btn"
    data-view="schedule"
  >
    <span class="nav-icon">🗓️</span>
    일정
  </button>


  <button
    class="nav-btn"
    data-view="favorites"
  >
    <span class="nav-icon">❤️</span>
    찜
  </button>

</nav>



<script>

(() => {


/* ================================
   기본 설정
================================ */

const STORAGE_KEY =
  "fukuoka-trip-v4";


const categoryInfo = {

  restaurant:{
    label:"맛집",
    emoji:"🍜",
    color:"#ef5350"
  },

  cafe:{
    label:"카페",
    emoji:"☕",
    color:"#a66b45"
  },

  shopping:{
    label:"쇼핑",
    emoji:"🛍️",
    color:"#8e61d4"
  },

  tour:{
    label:"관광",
    emoji:"📸",
    color:"#2f6fed"
  },

  hotel:{
    label:"숙소",
    emoji:"🏨",
    color:"#23a559"
  },

  etc:{
    label:"기타",
    emoji:"📍",
    color:"#666666"
  }

};


const defaultState = {

  selectedDay:"day1",

  travelMode:"walking",

  currentStart:true,

  days:{
    day1:[],
    day2:[],
    day3:[]
  },

  favorites:[]

};


let state =
  loadState();


let currentView =
  "home";


let map;

let routeMarkers = [];

let favoriteMarkers = [];

let previewMarker = null;

let myLocationMarker = null;

let lastSearchTime = 0;



/* ================================
   데이터
================================ */

function loadState(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem(STORAGE_KEY)
      );

    if(!saved){
      return structuredClone(defaultState);
    }


    return {

      ...structuredClone(defaultState),

      ...saved,

      days:{
        ...structuredClone(defaultState.days),
        ...(saved.days || {})
      },

      favorites:
        Array.isArray(saved.favorites)
        ? saved.favorites
        : []

    };

  }

  catch{

    return structuredClone(defaultState);

  }

}


function saveState(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );

}


function makeId(){

  if(
    window.crypto &&
    crypto.randomUUID
  ){

    return crypto.randomUUID();

  }

  return (
    Date.now() +
    "-" +
    Math.random()
  );

}



function currentRoute(){

  return (
    state.days[state.selectedDay] ||
    []
  );

}



function dayLabel(day){

  if(day === "day1")
    return "1일차";

  if(day === "day2")
    return "2일차";

  return "3일차";

}



/* ================================
   MAP
================================ */

function initMap(){

  map =
    new maplibregl.Map({

      container:"map",

      style:
        "https://tiles.openfreemap.org/styles/liberty",

      center:[
        130.4017,
        33.5902
      ],

      zoom:12.7

    });


  map.addControl(

    new maplibregl.NavigationControl({
      showCompass:false
    }),

    "bottom-right"

  );


  map.on(
    "load",
    () => {

      map.addSource(
        "routeLine",
        {

          type:"geojson",

          data:{
            type:"Feature",
            geometry:{
              type:"LineString",
              coordinates:[]
            }
          }

        }
      );


      map.addLayer({

        id:"routeLine",

        type:"line",

        source:"routeLine",

        paint:{

          "line-color":"#333333",

          "line-width":4,

          "line-opacity":0.6,

          "line-dasharray":[
            2,
            2
          ]

        }

      });


      refreshMap();

    }

  );

}



/* ================================
   MARKERS
================================ */

function clearMarkers(){

  routeMarkers.forEach(
    m => m.remove()
  );

  favoriteMarkers.forEach(
    m => m.remove()
  );


  routeMarkers = [];

  favoriteMarkers = [];

}



function refreshMap(){

  if(
    !map ||
    !map.loaded()
  ){
    return;
  }


  clearMarkers();


  const route =
    currentRoute();


  route.forEach(
    (place,index) => {

      const el =
        document.createElement("div");


      el.className =
        "number-marker";


      const color =
        categoryInfo[
          place.category || "etc"
        ].color;


      el.style.background =
        color;


      el.innerHTML =
        `<span>${index+1}</span>`;


      const marker =
        new maplibregl.Marker({

          element:el,

          anchor:"bottom"

        })

        .setLngLat([
          place.lng,
          place.lat
        ])

        .setPopup(

          new maplibregl.Popup({
            offset:25
          })

          .setHTML(

            `
            <b>${escapeHtml(place.name)}</b>
            <br>
            <small>
            ${
              categoryInfo[
                place.category || "etc"
              ].emoji
            }
            ${
              categoryInfo[
                place.category || "etc"
              ].label
            }
            </small>
            `

          )

        )

        .addTo(map);


      routeMarkers.push(marker);

    }

  );


  state.favorites.forEach(
    place => {

      const already =
        route.some(
          r => r.id === place.id
        );


      if(already){
        return;
      }


      const info =
        categoryInfo[
          place.category || "etc"
        ];


      const el =
        document.createElement("div");


      el.className =
        "favorite-marker";


      el.style.background =
        info.color;


      el.textContent =
        info.emoji;


      const marker =
        new maplibregl.Marker({
          element:el
        })

        .setLngLat([
          place.lng,
          place.lat
        ])

        .setPopup(

          new maplibregl.Popup({
            offset:20
          })

          .setHTML(
            `<b>${escapeHtml(place.name)}</b>`
          )

        )

        .addTo(map);


      favoriteMarkers.push(marker);

    }

  );


  updateRouteLine();

}



/* ================================
   ROUTE LINE
================================ */

function updateRouteLine(){

  const source =
    map.getSource("routeLine");


  if(!source){
    return;
  }


  source.setData({

    type:"Feature",

    geometry:{

      type:"LineString",

      coordinates:
        currentRoute().map(

          place => [
            place.lng,
            place.lat
          ]

        )

    }

  });

}



/* ================================
   SEARCH
================================ */

async function searchPlaces(){

  const input =
    document.getElementById(
      "searchInput"
    );


  const query =
    input.value.trim();


  if(!query){

    showSearchStatus(
      "검색어를 입력해줘.",
      true
    );

    return;

  }


  /*
    공용 무료 검색 서버에
    너무 빠르게 요청하지 않음
  */

  const now =
    Date.now();


  if(
    now - lastSearchTime <
    1100
  ){

    showSearchStatus(
      "잠깐 후 다시 검색해줘."
    );

    return;

  }


  lastSearchTime = now;


  const btn =
    document.getElementById(
      "searchBtn"
    );


  btn.disabled = true;

  btn.textContent =
    "검색중";


  showSearchStatus(
    "일본 지역에서 장소를 찾는 중..."
  );


  /*
    후쿠오카를 우선적으로 검색하지만
    다자이후 등 주변 지역도 검색 가능
  */

  const params =
    new URLSearchParams({

      format:"jsonv2",

      q:query,

      countrycodes:"jp",

      limit:"8",

      addressdetails:"1",

      namedetails:"1",

      "accept-language":
        "ko,ja,en",

      viewbox:
        "129.9,34.0,131.0,33.2",

      bounded:"0"

    });


  try{

    const response =
      await fetch(

        "https://nominatim.openstreetmap.org/search?" +
        params.toString(),

        {

          headers:{
            Accept:"application/json"
          }

        }

      );


    if(!response.ok){

      throw new Error(
        "검색 오류"
      );

    }


    const results =
      await response.json();


    renderSearchResults(
      results,
      query
    );

  }

  catch(error){

    showSearchStatus(

      "무료 검색에서 찾지 못했어. Google Maps 검색 버튼을 이용해줘.",

      true

    );


    showGoogleFallback(query);

  }

  finally{

    btn.disabled = false;

    btn.textContent =
      "검색";

  }

}



/* ================================
   SEARCH RESULT
================================ */

function resultName(item){

  const n =
    item.namedetails || {};


  return (

    n["name:ko"] ||

    n.name ||

    n["name:ja"] ||

    item.name ||

    (item.display_name || "")
      .split(",")[0] ||

    "검색 장소"

  );

}



function renderSearchResults(
  results,
  query
){

  const container =
    document.getElementById(
      "searchResults"
    );


  container.innerHTML = "";


  if(
    !Array.isArray(results) ||
    results.length === 0
  ){

    showSearchStatus(

      "검색 결과가 없어. 일본어·영어 이름으로 검색하거나 Google Maps 검색을 이용해줘."

    );


    showGoogleFallback(query);

    return;

  }


  showSearchStatus("");


  container.classList.add(
    "show"
  );


  results.forEach(
    result => {

      const lat =
        Number(result.lat);

      const lng =
        Number(result.lon);


      if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
      ){
        return;
      }


      const place = {

        id:makeId(),

        name:resultName(result),

        address:
          result.display_name || "",

        lat,

        lng,

        category:
          document
          .getElementById(
            "categorySelect"
          )
          .value

      };


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "result-item";


      div.innerHTML = `

        <div class="result-title">

          ${escapeHtml(place.name)}

        </div>


        <div class="result-address">

          ${escapeHtml(place.address)}

        </div>


        <div class="result-buttons">

          <button
            class="small-btn showPlace"
          >
            지도보기
          </button>


          <button
            class="small-btn dark addPlan"
          >
            + 일정
          </button>


          <button
            class="small-btn heart addFavorite"
          >
            ♡ 찜
          </button>

        </div>

      `;


      div
      .querySelector(".showPlace")
      .addEventListener(
        "click",
        () => {

          previewPlace(place);

        }
      );


      div
      .querySelector(".addPlan")
      .addEventListener(
        "click",
        () => {

          addToSchedule(place);

        }
      );


      div
      .querySelector(".addFavorite")
      .addEventListener(
        "click",
        () => {

          addFavorite(place);

        }
      );


      container.appendChild(div);

    }

  );

}



/* ================================
   SEARCH FALLBACK
================================ */

function showGoogleFallback(query){

  const container =
    document.getElementById(
      "searchResults"
    );


  container.innerHTML = "";

  container.classList.add("show");


  const div =
    document.createElement("div");


  div.className =
    "result-item";


  const button =
    document.createElement("button");


  button.className =
    "small-btn dark";


  button.style.width =
    "100%";


  button.textContent =
    `Google Maps에서 "${query}" 검색`;


  button.addEventListener(
    "click",
    () => {

      openGoogleSearch(query);

    }
  );


  div.appendChild(button);

  container.appendChild(div);

}



/* ================================
   PREVIEW
================================ */

function previewPlace(place){

  if(previewMarker){

    previewMarker.remove();

  }


  previewMarker =
    new maplibregl.Marker({
      color:"#3478f6"
    })

    .setLngLat([
      place.lng,
      place.lat
    ])

    .setPopup(

      new maplibregl.Popup({
        offset:25
      })

      .setHTML(
        `<b>${escapeHtml(place.name)}</b>`
      )

    )

    .addTo(map);


  previewMarker
    .togglePopup();


  map.flyTo({

    center:[
      place.lng,
      place.lat
    ],

    zoom:16,

    essential:true

  });

}



/* ================================
   ADD SCHEDULE
================================ */

function addToSchedule(place){

  const route =
    currentRoute();


  const exists =
    route.some(
      p =>
        distanceSame(p,place)
    );


  if(exists){

    alert(
      "이미 일정에 들어있는 장소야."
    );

    return;

  }


  state
  .days[state.selectedDay]
  .push({
    ...place
  });


  saveState();

  renderEverything();


  alert(
    `${dayLabel(state.selectedDay)} 일정에 추가했어.`
  );

}



/* ================================
   FAVORITE
================================ */

function addFavorite(place){

  const exists =
    state.favorites.some(

      p =>
        distanceSame(
          p,
          place
        )

    );


  if(exists){

    alert(
      "이미 찜한 장소야."
    );

    return;

  }


  state.favorites.push({
    ...place
  });


  saveState();

  renderEverything();


  alert(
    "찜 목록에 추가했어. ❤️"
  );

}

/* ================================
   SCHEDULE RENDER
================================ */

function renderSchedule(){

  const container =
    document.getElementById(
      "routeList"
    );


  const route =
    currentRoute();


  if(route.length === 0){

    container.innerHTML = `

      <div class="empty">

        ${dayLabel(state.selectedDay)}
        일정이 비어있어.<br><br>

        지도에서 장소를 추가해줘.

      </div>

    `;

    return;

  }


  container.innerHTML = "";


  route.forEach(
    (place,index) => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "route-item";


      row.innerHTML = `

        <div class="route-num">

          ${index+1}

        </div>


        <div>

          <div class="route-name">

            ${
              categoryInfo[
                place.category || "etc"
              ].emoji
            }

            ${escapeHtml(place.name)}

          </div>


          <div class="route-detail">

            ${
              index ===
              route.length-1
              ?
              "목적지"
              :
              "경유지"
            }

          </div>

        </div>


        <div class="route-actions">

          <button
            class="route-action up"
          >
            ↑
          </button>

          <button
            class="route-action down"
          >
            ↓
          </button>

          <button
            class="route-action delete"
          >
            ✕
          </button>

        </div>

      `;


      const up =
        row.querySelector(".up");


      const down =
        row.querySelector(".down");


      up.disabled =
        index === 0;


      down.disabled =
        index ===
        route.length-1;


      up.addEventListener(
        "click",
        () => {

          moveRoute(
            index,
            -1
          );

        }
      );


      down.addEventListener(
        "click",
        () => {

          moveRoute(
            index,
            1
          );

        }
      );


      row
      .querySelector(".delete")
      .addEventListener(
        "click",
        () => {

          removeRoute(index);

        }
      );


      container.appendChild(row);

    }

  );

}



/* ================================
   MOVE ROUTE
================================ */

function moveRoute(
  index,
  direction
){

  const route =
    currentRoute();


  const target =
    index + direction;


  if(
    target < 0 ||
    target >= route.length
  ){
    return;
  }


  [
    route[index],
    route[target]
  ] = [
    route[target],
    route[index]
  ];


  saveState();

  renderEverything();

}



function removeRoute(index){

  currentRoute()
  .splice(index,1);


  saveState();

  renderEverything();

}

/* ================================

================================ */

function renderDayTabs(){

  document
  .querySelectorAll(
    "[data-day-tabs]"
  )
  .forEach(
    container => {

      container.innerHTML = "";


      [
        ["day1","1일차"],
        ["day2","2일차"],
        ["day3","3일차"]
      ]
      .forEach(
        ([value,label]) => {

          const btn =
            document.createElement(
              "button"
            );


          btn.className =
            "day-tab";


          if(
            state.selectedDay ===
            value
          ){

            btn.classList.add(
              "active"
            );

          }


          btn.textContent =
            label;


          btn.addEventListener(
            "click",
            () => {

              state.selectedDay =
                value;


              saveState();

              renderEverything();

            }
          );


          container.appendChild(btn);

        }

      );

    }

  );

}



/* ================================
   FIT ROUTE
================================ */

function fitRoute(){

  const route =
    currentRoute();


  if(route.length === 0){

    alert(
      "일정에 장소를 먼저 추가해줘."
    );

    return;

  }


  if(route.length === 1){

    map.flyTo({

      center:[
        route[0].lng,
        route[0].lat
      ],

      zoom:16,

      essential:true

    });

    return;

  }


  const bounds =
    new maplibregl
    .LngLatBounds();


  route.forEach(
    place => {

      bounds.extend([
        place.lng,
        place.lat
      ]);

    }
  );


  map.fitBounds(

    bounds,

    {

      padding:70,

      maxZoom:15

    }

  );

}



/* ================================
   현재 위치
================================ */

function showMyLocation(){

  if(
    !navigator.geolocation
  ){

    alert(
      "이 기기에서는 위치 기능을 사용할 수 없어."
    );

    return;

  }


  navigator
  .geolocation
  .getCurrentPosition(

    position => {

      const lng =
        position.coords.longitude;

      const lat =
        position.coords.latitude;


      if(myLocationMarker){

        myLocationMarker.remove();

      }


      const el =
        document.createElement(
          "div"
        );


      el.className =
        "me-marker";


      myLocationMarker =
        new maplibregl.Marker({
          element:el
        })

        .setLngLat([
          lng,
          lat
        ])

        .setPopup(

          new maplibregl.Popup({
            offset:18
          })

          .setHTML(
            "<b>현재 위치</b>"
          )

        )

        .addTo(map);


      map.flyTo({

        center:[
          lng,
          lat
        ],

        zoom:16,

        essential:true

      });

    },

    () => {

      alert(
        "위치 권한을 허용해줘."
      );

    },

    {

      enableHighAccuracy:true,

      timeout:10000

    }

  );

}



/* ================================
   GOOGLE MAPS SEARCH
================================ */

function openGoogleSearch(
  customQuery=null
){

  const input =
    document.getElementById(
      "searchInput"
    );


  const query =
    customQuery ||
    input.value.trim();


  if(!query){

    alert(
      "검색어를 먼저 입력해줘."
    );

    return;

  }


  const url =

    "https://www.google.com/maps/search/?api=1&query=" +

    encodeURIComponent(
      query + " Fukuoka Japan"
    );


  window.open(
    url,
    "_blank"
  );

}



/* ================================
   GOOGLE ROUTE
================================ */

function openGoogleRoute(){

  const route =
    currentRoute();


  if(route.length === 0){

    alert(
      "일정에 장소를 추가해줘."
    );

    return;

  }


  const currentStart =
    document.getElementById(
      "currentStart"
    ).checked;


  const travelMode =
    document.getElementById(
      "travelMode"
    ).value;


  /*
    모바일 Google Maps는
    경유지 지원 수가 제한됨.
  */

  if(
    currentStart &&
    route.length > 4
  ){

    alert(

      "Google Maps 모바일 길찾기는 현재 위치 + 목적지 기준으로 한 번에 4곳 정도로 나누는 게 좋아.\n\n일정을 4곳 이하로 줄인 뒤 다시 눌러줘."

    );

    return;

  }


  if(
    !currentStart &&
    route.length > 5
  ){

    alert(

      "Google Maps 모바일 경유지 제한 때문에 한 번에 너무 많은 장소를 넣을 수 없어.\n\n5곳 이하로 줄여줘."

    );

    return;

  }


  const params =
    new URLSearchParams();


  params.set(
    "api",
    "1"
  );


  params.set(
    "travelmode",
    travelMode
  );


  params.set(
    "dir_action",
    "navigate"
  );


  const destination =
    route[
      route.length-1
    ];


  params.set(

    "destination",

    `${destination.lat},${destination.lng}`

  );


  let waypoints = [];


  if(currentStart){

    waypoints =
      route.slice(
        0,
        -1
      );

  }

  else{

    if(route.length < 2){

      alert(
        "출발지와 목적지가 필요해."
      );

      return;

    }


    const origin =
      route[0];


    params.set(

      "origin",

      `${origin.lat},${origin.lng}`

    );


    waypoints =
      route.slice(
        1,
        -1
      );

  }


  if(
    waypoints.length > 0
  ){

    params.set(

      "waypoints",

      waypoints
      .map(
        place =>
          `${place.lat},${place.lng}`
      )
      .join("|")

    );

  }


  const url =

    "https://www.google.com/maps/dir/?" +

    params.toString();


  /*
    새 탭 / Google Maps 앱으로 열림.
    우리 여행앱은 그대로 남아있음.
  */

  window.open(
    url,
    "_blank"
  );

}



/* ================================
   VIEW
================================ */

function changeView(view){

  currentView =
    view;


  document
  .querySelectorAll(".view")
  .forEach(
    section => {

      section.classList.remove(
        "active"
      );

    }
  );


  document
  .getElementById(
    view + "View"
  )
  .classList.add(
    "active"
  );


  document
  .querySelectorAll(".nav-btn")
  .forEach(
    btn => {

      btn.classList.toggle(

        "active",

        btn.dataset.view ===
        view

      );

    }
  );


  if(view === "map"){

    setTimeout(
      () => {

        map.resize();

        refreshMap();

      },
      120
    );

  }


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}



/* ================================
   STATUS
================================ */

function showSearchStatus(
  text,
  error=false
){

  const el =
    document.getElementById(
      "searchStatus"
    );


  el.textContent =
    text;


  el.classList.toggle(
    "show",
    Boolean(text)
  );


  el.classList.toggle(
    "error",
    error
  );

}



/* ================================
   UTILS
================================ */

function distanceSame(
  a,
  b
){

  return (

    Math.abs(
      Number(a.lat) -
      Number(b.lat)
    )
    <
    0.00002

    &&

    Math.abs(
      Number(a.lng) -
      Number(b.lng)
    )
    <
    0.00002

  );

}



function escapeHtml(value){

  return String(
    value || ""
  )
  .replace(

    /[&<>"']/g,

    char => ({

      "&":"&amp;",

      "<":"&lt;",

      ">":"&gt;",

      '"':"&quot;",

      "'":"&#039;"

    })[char]

  );

}

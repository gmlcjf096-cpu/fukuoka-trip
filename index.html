<!doctype html>

<html lang="ko">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>
  후쿠오카 여행
</title>


<link
  href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css"
  rel="stylesheet"
>


<script
  src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js">
</script>


<style>

:root {

  --bg:#f5f6f8;

  --card:#fff;

  --text:#16181c;

  --muted:#737982;

  --line:#e5e7eb;

  --blue:#2563eb;

  --red:#dc2626;

}


* {
  box-sizing:border-box;
}


html,
body {

  margin:0;

  min-height:100%;

  background:
    var(--bg);

  color:
    var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans KR",
    sans-serif;
}


button,
input,
select {
  font:inherit;
}


button {
  cursor:pointer;
}


.app {

  min-height:100vh;

  padding-bottom:72px;
}


.top {

  position:sticky;

  top:0;

  z-index:30;

  background:
    rgba(255,255,255,.96);

  backdrop-filter:
    blur(10px);

  border-bottom:
    1px solid var(--line);

  padding:
    13px 14px;
}


.top h1 {

  margin:0;

  font-size:20px;

}


.top p {

  margin:
    4px 0 0;

  color:
    var(--muted);

  font-size:12px;

}


.view {
  display:none;
}


.view.active {
  display:block;
}


.page {
  padding:12px;
}


.card {

  background:#fff;

  border:
    1px solid var(--line);

  border-radius:
    16px;

  padding:
    14px;

  margin-bottom:
    10px;

}


.title {

  font-size:16px;

  font-weight:900;

  margin-bottom:10px;

}


.muted {

  color:
    var(--muted);

  font-size:12px;

}


.hero {

  padding:20px;

  border-radius:20px;

  background:
    linear-gradient(
      135deg,
      #e9f2ff,
      #fff1e8
    );

}


.hero small {

  font-weight:800;

  color:#64748b;

}


.hero h2 {

  font-size:26px;

  line-height:1.2;

  margin:
    6px 0;

}


.hero p {

  margin:0;

  color:#62666d;

  font-size:13px;

}


.quick {

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:8px;

  margin-top:14px;

}


.quick button {

  min-height:62px;

  border:0;

  border-radius:14px;

  background:#fff;

  text-align:left;

  padding:11px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.05);

  font-weight:850;

}


.quick span {

  display:block;

  font-size:21px;

  margin-bottom:3px;

}


.days,
.modes {

  display:flex;

  gap:7px;

  overflow-x:auto;

}


.pill {

  min-height:38px;

  border:
    1px solid var(--line);

  border-radius:999px;

  background:#fff;

  padding:
    0 13px;

  font-size:13px;

  font-weight:800;

  white-space:nowrap;

}


.pill.active {

  background:#171717;

  color:#fff;

  border-color:#171717;

}


/* 검색 */

.searchBox {

  background:#fff;

  padding:
    10px 12px;

  border-bottom:
    1px solid var(--line);

  position:relative;

  z-index:12;

}


.searchRow {

  display:grid;

  grid-template-columns:
    1fr auto;

  gap:7px;

}


.searchRow input {

  height:46px;

  width:100%;

  border:
    1px solid #d5d9df;

  border-radius:13px;

  padding:
    0 13px;

  font-size:16px;

  outline:none;

}


.searchRow input:focus {

  border-color:#8d929a;

  box-shadow:
    0 0 0 3px
    rgba(0,0,0,.04);

}


.searchBtn {

  height:46px;

  border:0;

  border-radius:13px;

  background:#171717;

  color:#fff;

  padding:
    0 17px;

  font-weight:900;

}


.searchTools {

  display:flex;

  gap:7px;

  overflow-x:auto;

  margin-top:8px;

}


.searchTools select {

  height:38px;

  border:
    1px solid #d9dde2;

  border-radius:11px;

  background:#fff;

  padding:
    0 10px;

  font-weight:750;

}


.hint {

  margin-top:7px;

  color:
    var(--muted);

  font-size:11px;

}


/* 검색결과 */

.results {

  display:none;

  background:#fff;

  border-bottom:
    1px solid var(--line);

  max-height:340px;

  overflow:auto;

  position:relative;

  z-index:11;

}


.results.show {
  display:block;
}


.result {

  padding:
    11px 12px;

  border-bottom:
    1px solid var(--line);

}


.resultName {

  font-size:14px;

  font-weight:900;

}


.resultNative {

  margin-top:2px;

  color:#475569;

  font-size:11px;

}


.resultAddress {

  margin-top:3px;

  color:
    var(--muted);

  font-size:11px;

  line-height:1.4;

}


.actions {

  display:flex;

  flex-wrap:wrap;

  gap:6px;

  margin-top:8px;

}


.btn {

  min-height:36px;

  border:
    1px solid #d9dce1;

  border-radius:10px;

  background:#fff;

  padding:
    6px 10px;

  font-size:12px;

  font-weight:850;

}


.btn.primary {

  background:
    var(--blue);

  border-color:
    var(--blue);

  color:#fff;

}


.btn.dark {

  background:#171717;

  border-color:#171717;

  color:#fff;

}


.btn.danger {
  color:var(--red);
}


.status {

  display:none;

  padding:
    9px 12px;

  background:#eef5ff;

  color:#315d92;

  font-size:12px;

  border-bottom:
    1px solid #dce8f8;

}


.status.show {
  display:block;
}


.status.error {

  background:#fff0f0;

  color:#973232;

}


/* 지도 */

.mapWrap {

  position:relative;

  height:54vh;

  min-height:410px;

  background:#dde4ec;

}


.map {

  position:absolute;

  inset:0;

}


.mapTools {

  position:absolute;

  right:10px;

  top:10px;

  z-index:7;

  display:flex;

  flex-direction:column;

  gap:7px;

}


.mapTools button {

  min-height:42px;

  border:
    1px solid #d9dde2;

  border-radius:12px;

  background:
    rgba(255,255,255,.96);

  box-shadow:
    0 4px 14px
    rgba(0,0,0,.12);

  padding:
    0 10px;

  font-size:12px;

  font-weight:900;

}


.mapTools button.active {

  background:#171717;

  color:#fff;

}


/* 길찾기 */

.routePanel {

  background:#fff;

  border-top:
    1px solid var(--line);

  padding:12px;

}


.summary {

  display:flex;

  justify-content:
    space-between;

  align-items:flex-end;

  gap:8px;

}


.routeTime {

  font-size:25px;

  font-weight:950;

}


.routeDistance {

  font-size:13px;

  color:
    var(--muted);

}


.stopList {

  display:grid;

  gap:7px;

  margin-top:10px;

}


.stop {

  display:grid;

  grid-template-columns:
    34px minmax(0,1fr) auto;

  gap:8px;

  align-items:center;

  border:
    1px solid var(--line);

  border-radius:13px;

  padding:9px;

  background:#fff;

}


.num {

  width:30px;

  height:30px;

  border-radius:50%;

  display:grid;

  place-items:center;

  background:#171717;

  color:#fff;

  font-size:12px;

  font-weight:900;

}


.stopName {

  font-size:13px;

  font-weight:900;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;

}


.stopSub {

  font-size:11px;

  color:
    var(--muted);

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;

  margin-top:2px;

}


.icon {

  width:31px;

  height:31px;

  border:
    1px solid #dcdfe4;

  border-radius:9px;

  background:#fff;

  font-weight:900;

}


.empty {

  padding:
    22px 12px;

  border:
    1px dashed #ccd0d6;

  border-radius:14px;

  color:
    var(--muted);

  font-size:13px;

  text-align:center;

}


.routeBtns {

  display:flex;

  flex-wrap:wrap;

  gap:7px;

  margin-top:10px;

}


/* 핀 */

.marker {

  width:34px;

  height:34px;

  border-radius:
    18px 18px 18px 5px;

  transform:
    rotate(-45deg);

  border:
    3px solid #fff;

  display:grid;

  place-items:center;

  box-shadow:
    0 3px 11px
    rgba(0,0,0,.28);

  background:#171717;

}


.marker span {

  transform:
    rotate(45deg);

  color:#fff;

  font-size:12px;

  font-weight:950;

}


.me {

  width:22px;

  height:22px;

  border-radius:50%;

  background:#3478f6;

  border:
    4px solid #fff;

  box-shadow:
    0 0 0 5px
    rgba(52,120,246,.2),
    0 3px 9px
    rgba(0,0,0,.25);

}


.startMarker {

  width:28px;

  height:28px;

  border-radius:50%;

  background:#16a34a;

  border:
    4px solid #fff;

  box-shadow:
    0 3px 10px
    rgba(0,0,0,.24);

}


/* 찜 */

.favorite {

  padding:
    11px 0;

  border-bottom:
    1px solid var(--line);

}


.tag {

  display:inline-block;

  margin-top:5px;

  padding:
    4px 8px;

  border-radius:999px;

  background:#f1f3f5;

  font-size:11px;

  font-weight:800;

  color:#555;

}


/* 하단메뉴 */

.bottom {

  position:fixed;

  left:0;

  right:0;

  bottom:0;

  z-index:50;

  height:66px;

  padding-bottom:
    env(safe-area-inset-bottom);

  background:
    rgba(255,255,255,.97);

  backdrop-filter:
    blur(14px);

  border-top:
    1px solid var(--line);

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

}


.bottom button {

  border:0;

  background:transparent;

  color:#858991;

  font-size:11px;

  font-weight:800;

}


.bottom span {

  display:block;

  font-size:20px;

  margin-bottom:2px;

}


.bottom button.active {
  color:#111;
}


@media(min-width:820px) {

  .app {

    max-width:1100px;

    margin:auto;

  }


  .mapWrap {
    height:650px;
  }


  .bottom {

    left:50%;

    transform:
      translateX(-50%);

    max-width:720px;

    border-left:
      1px solid var(--line);

    border-right:
      1px solid var(--line);

    border-radius:
      16px 16px 0 0;

  }

}

</style>

</head>



<body>


<div class="app">


<header class="top">

<h1>
🇯🇵 후쿠오카 여행

<main>


<section
id="homeView"

>

🔎
</span>

<section

>

<div

id="results"
class="results"

id="map"

<button id="currentBtn">

<button id="pickDestBtn">
🎯 목적지 찍기

<button id="fitBtn">

</button>


</div>


</div>



<div class="routePanel">


<div class="summary">

<div>

<div class="muted">

</div>

일정

</span>

</button>

<script>

(() => {


const WORKER =
"https://orange-recipe-d340fukuoka-route.wnals4836.workers.dev";


const STORAGE =
"fukuoka-trip-v8";


const FUKUOKA = {
lat:33.5902,
lng:130.4017
};



const categoryInfo = {

restaurant:{
label:"맛집",
emoji:"🍜",
color:"#ef5350"
},

cafe:{
label:"카페",
emoji:"☕",
color:"#a66b45"
},

shopping:{
label:"쇼핑",
emoji:"🛍️",
color:"#8e61d4"
},

tour:{
label:"관광",
emoji:"📸",
color:"#2f6fed"
},

hotel:{
label:"숙소",
emoji:"🏨",
color:"#16a34a"
},

etc:{
label:"기타",
emoji:"📍",
color:"#6b7280"
}

};



const KO_RULES = [

[
/天神駅|Tenjin Station/i,
"텐진역"
],

[
/博多駅|Hakata Station/i,
"하카타역"
],

[
/福岡空港|Fukuoka Airport/i,
"후쿠오카공항"
],

[
/キャナルシティ博多|Canal City Hakata/i,
"캐널시티 하카타"
],

[
/大濠公園|Ohori Park/i,
"오호리공원"
],

[
/福岡タワー|Fukuoka Tower/i,
"후쿠오카타워"
],

[
/太宰府天満宮|Dazaifu Tenmangu/i,
"다자이후 텐만구"
],

[
/中洲川端駅|Nakasu-Kawabata Station/i,
"나카스카와바타역"
],

[
/天神南駅|Tenjin-minami Station/i,
"텐진미나미역"
],

[
/櫛田神社|Kushida Shrine/i,
"구시다신사"
],

[
/天神地下街/i,
"텐진지하상가"
],

[
/ららぽーと福岡/i,
"라라포트 후쿠오카"
],

[
/マリンワールド海の中道/i,
"마린월드 우미노나카미치"
],

[
/海の中道海浜公園/i,
"우미노나카미치 해변공원"
],

[
/柳橋連合市場/i,
"야나기바시 시장"
]

];



const baseState = {

selectedDay:
"day1",

routeMode:
"walking",

days:{
day1:[],
day2:[],
day3:[]
},

favorites:[],

navStops:[],

manualStart:null,

useManualStart:false

};



let state =
loadState();


let map;

let mapReady =
false;

let currentLocation =
null;

let pickMode =
null;

let searchTimer =
null;

let searchAbort =
null;

let lastRoute =
null;

let lastSegments =
[];


let routeMarkers =
[];

let savedMarkers =
[];

let previewMarker =
null;

let currentMarker =
null;

let startMarker =
null;



function clone(x) {

return JSON.parse(
JSON.stringify(x)
);

}



function loadState() {

try {

const saved =
JSON.parse(
localStorage.getItem(
STORAGE
) || "null"
);


if (!saved) {

return clone(
baseState
);

}


return {

...clone(baseState),

...saved,

days:{

...clone(
baseState.days
),

...(saved.days || {})

},

favorites:
Array.isArray(
saved.favorites
)
?
saved.favorites
:
[],

navStops:
Array.isArray(
saved.navStops
)
?
saved.navStops
:
[]

};

}

catch {

return clone(
baseState
);

}

}



function saveState() {

localStorage.setItem(
STORAGE,
JSON.stringify(state)
);

}

function makeId() {

return (
crypto.randomUUID
?
crypto.randomUUID()
:
Date.now()
+
"-"
+
Math.random()
);

function esc(value) {

return String(
value ?? ""
)
.replace(

/[&<>"']/g,

char => ({

"&":"&amp;",

"<":"&lt;",

">":"&gt;",

'"':"&quot;",

"'":"&#039;"

})[char]

);

}



function samePlace(a,b) {

return (

Math.abs(
Number(a.lat) -
Number(b.lat)
)
<
0.00002

&&

Math.abs(
Number(a.lng) -
Number(b.lng)
)
<
0.00002

);

}



function koName(text) {

const value =
String(text || "");


for (
const [rule,korean]
of KO_RULES
) {

if (
rule.test(value)
) {

return korean;

}

}


return value;

}



function formatDistance(meters) {

if (
meters >= 1000
) {

return (
meters / 1000
)
.toFixed(
meters >= 10000
?
0
:
1
)
+
"km";

}


return (
Math.round(meters)
+
"m"
);

}



function formatDuration(seconds) {

const minutes =
Math.round(
seconds / 60
);


if (
minutes < 60
) {

return (
minutes +
"분"
);

}


const hours =
Math.floor(
minutes / 60
);


const remain =
minutes % 60;


return (

hours +
"시간 " +

(
remain
?
remain + "분"
:
""
)

);

}

/* ========================

function distanceKm(a,b) {

const R =
6371;


const toRad =
value =>
value * Math.PI / 180;


const dLat =
toRad(
b.lat -
a.lat
);


const dLng =
toRad(
b.lng -
a.lng
);


const value =

Math.sin(
dLat/2
) ** 2

+

Math.cos(
toRad(a.lat)
)

*

Math.cos(
toRad(b.lat)
)

*

Math.sin(
dLng/2
) ** 2;


return (
2 *
R *
Math.asin(
Math.sqrt(value)
)
);

}



function getCurrentLocation(
force=false
) {

if (
currentLocation &&
!force
) {

return Promise.resolve(
currentLocation
);

}


if (
!navigator.geolocation
) {

return Promise.reject(

new Error(
"이 기기에서는 위치 기능을 사용할 수 없어."
)

);

}


return new Promise(
(resolve,reject) => {


navigator.geolocation
.getCurrentPosition(

position => {


currentLocation = {

lat:
position.coords.latitude,

lng:
position.coords.longitude

};


setCurrentMarker(
false
);


resolve(
currentLocation
);

},

error => {


reject(

new Error(

error.code === 1

?

"브라우저 위치 권한을 허용해줘."

:

"현재 위치를 가져오지 못했어."

)

);

},

{

enableHighAccuracy:
true,

timeout:
12000,

maximumAge:
10000

}

);

}
);

}



async function getRouteStart() {

if (
state.useManualStart &&
state.manualStart
) {

return state.manualStart;

}


const location =
await getCurrentLocation();


/*
한국에서 테스트할 경우
후쿠오카까지 도보경로를
계산하는 실수를 막음
*/

if (
distanceKm(
location,
FUKUOKA
) > 200
) {

throw new Error(

"현재 위치가 후쿠오카에서 멀리 있어. 한국에서 테스트 중이면 ‘출발지 찍기’로 후쿠오카 안의 출발지를 먼저 찍어줘."

);

}


return {

...location,

name:
"현재 위치"

};

}

await response.json();


if (

async function calculateRoute() {

if (
!state.navStops.length
) {

setSummary(

null,

"검색 결과에서 ‘바로 길찾기’를 눌러줘."

);


clearRouteLine();

return;

}


setSummary(

"계산 중...",

"실제 도로 경로를 계산하고 있어."

);


try {


const start =
await getRouteStart();


const coordinates = [

[
start.lng,
start.lat
],

...state.navStops
.map(
place => [
place.lng,
place.lat
]
)

];


const response =
await fetch(

`${WORKER}/route`,

{

method:
"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({

profile:
state.routeMode,

coordinates

})

}

);


const data =
await response.json();


if (
!response.ok
) {

throw new Error(

data.error?.message ||

data.error ||

data.message ||

`길찾기 오류 ${response.status}`

);

}


lastRoute =
data;


lastSegments =

data.features?.[0]
?.properties
?.segments

||

[];


drawRoute(
data
);


renderNavStops();


const summary =

data.features?.[0]
?.properties
?.summary;


if (
summary
) {


document
.getElementById(
"routeTime"
)
.textContent =
formatDuration(
summary.duration
);


document
.getElementById(
"routeDistance"
)
.textContent =
formatDistance(
summary.distance
);


document
.getElementById(
"routeMessage"
)
.textContent =

`${modeLabel()} · ${start.name || "출발지"} → ${state.navStops[state.navStops.length-1].name}`;

}

else {

setSummary(

"경로 완료",

modeLabel() +
" 경로를 표시했어."

);

}


refreshMarkers();

}

catch(error) {

setSummary(

"길찾기 실패",

error.message

);


alert(
error.message
);

}

}



function drawRoute(
geojson
) {

if (
!mapReady ||
!map.getSource(
"route"
)
) {

return;

}


map
.getSource(
"route"
)
.setData(
geojson
);


const coordinates =

geojson.features?.[0]
?.geometry
?.coordinates

||

[];


if (
!coordinates.length
) {

return;

}


const bounds =
new maplibregl
.LngLatBounds();


coordinates.forEach(
coordinate =>
bounds.extend(
coordinate
)
);


map.fitBounds(

bounds,

{

padding:
55,

maxZoom:
16,

duration:
650

}

);

}



function clearRouteLine() {

lastRoute =
null;


lastSegments =
[];


if (
mapReady &&
map.getSource(
"route"
)
) {

map
.getSource(
"route"
)
.setData({

type:
"FeatureCollection",

features:[]

});

);

async function moveNav(
index,
direction
) {

const target =
index +
direction;


if (
target < 0 ||
target >=
state.navStops.length
) {

return;

}


[
state.navStops[index],
state.navStops[target]
]
=
[

state.navStops[index]
];

await calculateRoute();

}

index,
direction
) {

const schedule =
currentSchedule();


const target =
index +
direction;


if (
target < 0 ||
target >=
schedule.length
) {

return;

}


[
schedule[index],
schedule[target]
]
=
[
schedule[target],
schedule[index]
];


saveState();

renderAll();

}

/* ========================
   화면
======================== */

function changeView(
view
) {

document
.querySelectorAll(
".view"
)
.forEach(
item =>
item.classList.remove(
"active"
)
);


document
.getElementById(
view +
"View"
)
.classList.add(
"active"
);


document
.querySelectorAll(
".bottom button"
)
.forEach(
button => {


button.classList.toggle(

"active",

button.dataset.view ===
view

);

}
);


if (
view === "map"
) {

setTimeout(
() => {

map.resize();

refreshMarkers();


if (
lastRoute
) {

drawRoute(
lastRoute
);

}

},
100
);

}


window.scrollTo({

top:0,

behavior:"smooth"

});

}



function fitRoute() {

if (
lastRoute
) {

drawRoute(
lastRoute
);

return;

}


const points =
[
...state.navStops
];


if (
state.useManualStart &&
state.manualStart
) {

points.unshift(
state.manualStart
);

}

else if (
currentLocation
) {

points.unshift(
currentLocation
);

}


if (
!points.length
) {
return;
}


const bounds =
new maplibregl
.LngLatBounds();


points.forEach(
place =>
bounds.extend([
place.lng,
place.lat
])
);


if (
points.length === 1
) {

map.flyTo({

center:[
points[0].lng,
points[0].lat
],

zoom:
15.5

});

}

else {

map.fitBounds(

bounds,

{
padding:60,
maxZoom:15
}

);

}

}

mode
) {

pickMode =

document

"pickStartBtn"

);

) {

showStatus(

"지도에서 출발할 위치를 한 번 눌러줘."

:

"지도에서 목적지로 쓸 위치를 한 번 눌러줘."

);

}

}

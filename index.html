<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>후쿠오카 여행</title>


<link
  href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css"
  rel="stylesheet"
>

<script
  src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js">
</script>


<style>

:root {

  --bg:#f5f6f8;
  --card:#ffffff;
  --text:#15171a;
  --muted:#767b83;
  --line:#e5e7eb;

  --accent:#2563eb;
  --accent-soft:#eaf1ff;

  --danger:#dc2626;
  --green:#16a34a;
}


* {
  box-sizing:border-box;
}


html,
body {

  margin:0;
  min-height:100%;

  background:var(--bg);

  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans KR",
    sans-serif;
}


button,
input,
select {
  font:inherit;
}


button {
  cursor:pointer;
}


button:disabled {
  opacity:.5;
  cursor:not-allowed;
}


.app {

  min-height:100vh;

  padding-bottom:72px;
}


/* =============================
   TOP
============================= */

.topbar {

  position:sticky;

  top:0;

  z-index:30;

  background:
    rgba(255,255,255,.96);

  border-bottom:
    1px solid var(--line);

  padding:
    13px 14px 11px;

  backdrop-filter:
    blur(10px);
}


.topbar h1 {

  margin:0;

  font-size:20px;
}


.topbar p {

  margin:
    4px 0 0;

  color:
    var(--muted);

  font-size:12px;
}


/* =============================
   COMMON
============================= */

.view {
  display:none;
}


.view.active {
  display:block;
}


.page {
  padding:12px;
}


.card {

  background:
    var(--card);

  border:
    1px solid var(--line);

  border-radius:
    16px;

  padding:
    14px;

  margin-bottom:
    10px;
}


.section-title {

  font-size:
    16px;

  font-weight:
    900;

  margin-bottom:
    10px;
}


.muted {

  color:
    var(--muted);

  font-size:
    12px;
}


/* =============================
   HOME
============================= */

.hero {

  background:
    linear-gradient(
      135deg,
      #eaf2ff,
      #fff0e6
    );

  border-radius:
    20px;

  padding:
    18px;
}


.hero .eyebrow {

  font-size:
    12px;

  font-weight:
    800;

  color:
    #64748b;
}


.hero h2 {

  margin:
    5px 0 6px;

  font-size:
    25px;

  line-height:
    1.2;
}


.hero p {

  margin:0;

  color:
    #62666d;

  font-size:
    13px;
}


.quick-grid {

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    8px;

  margin-top:
    13px;
}


.quick-btn {

  min-height:
    64px;

  border:0;

  border-radius:
    14px;

  background:
    #ffffff;

  text-align:
    left;

  padding:
    11px;

  box-shadow:
    0 3px 12px rgba(0,0,0,.05);
}


.quick-btn span {

  display:block;

  font-size:
    20px;

  margin-bottom:
    4px;
}


.quick-btn b {

  font-size:
    13px;
}


/* =============================
   DAY / MODE
============================= */

.day-tabs,
.mode-tabs {

  display:flex;

  gap:7px;

  overflow-x:auto;
}


.day-tab,
.mode-btn {

  min-height:
    38px;

  border:
    1px solid var(--line);

  border-radius:
    999px;

  background:
    #ffffff;

  padding:
    0 13px;

  font-size:
    13px;

  font-weight:
    800;

  white-space:
    nowrap;
}


.day-tab.active,
.mode-btn.active {

  background:
    #151515;

  color:
    #ffffff;

  border-color:
    #151515;
}


/* =============================
   SEARCH
============================= */

.search-box {

  background:
    #ffffff;

  padding:
    10px 12px;

  border-bottom:
    1px solid var(--line);
}


.search-row {

  display:grid;

  grid-template-columns:
    1fr auto;

  gap:
    7px;
}


.search-row input {

  width:
    100%;

  height:
    46px;

  border:
    1px solid #d6d9de;

  border-radius:
    13px;

  padding:
    0 13px;

  font-size:
    16px;

  outline:
    none;
}


.search-row input:focus {

  border-color:
    #8b8f97;

  box-shadow:
    0 0 0 3px rgba(0,0,0,.04);
}


.search-btn {

  height:
    46px;

  border:0;

  border-radius:
    13px;

  background:
    #151515;

  color:
    #ffffff;

  padding:
    0 17px;

  font-weight:
    900;
}


.search-tools {

  display:flex;

  gap:
    7px;

  margin-top:
    8px;

  overflow-x:
    auto;
}


.category-select {

  height:
    38px;

  border:
    1px solid #dcdfe4;

  border-radius:
    11px;

  background:
    #ffffff;

  padding:
    0 10px;

  font-size:
    13px;

  font-weight:
    750;
}


/* =============================
   STATUS
============================= */

.status {

  display:none;

  padding:
    9px 12px;

  background:
    #eef5ff;

  color:
    #315d92;

  font-size:
    12px;

  border-bottom:
    1px solid #dce9f9;
}


.status.show {
  display:block;
}


.status.error {

  background:
    #fff0f0;

  color:
    #9b3232;
}


/* =============================
   SEARCH RESULT
============================= */

.search-results {

  display:none;

  background:
    #ffffff;

  max-height:
    330px;

  overflow:
    auto;

  border-bottom:
    1px solid var(--line);
}


.search-results.show {
  display:block;
}


.result {

  padding:
    12px;

  border-bottom:
    1px solid var(--line);
}


.result:last-child {
  border-bottom:0;
}


.result-name {

  font-weight:
    900;

  font-size:
    14px;
}


.result-address {

  margin-top:
    4px;

  color:
    var(--muted);

  font-size:
    11px;

  line-height:
    1.45;
}


.result-actions {

  display:flex;

  flex-wrap:
    wrap;

  gap:
    6px;

  margin-top:
    9px;
}


.small-btn {

  min-height:
    36px;

  border:
    1px solid #d9dce1;

  border-radius:
    10px;

  background:
    #ffffff;

  padding:
    6px 10px;

  font-size:
    12px;

  font-weight:
    850;
}


.small-btn.primary {

  background:
    var(--accent);

  color:
    #ffffff;

  border-color:
    var(--accent);
}


.small-btn.dark {

  background:
    #151515;

  color:
    #ffffff;

  border-color:
    #151515;
}


.small-btn.danger {

  color:
    var(--danger);
}


/* =============================
   MAP
============================= */

.map-wrap {

  position:
    relative;

  height:
    54vh;

  min-height:
    410px;

  background:
    #dde5ef;
}


#map {

  position:
    absolute;

  inset:
    0;
}


.map-tools {

  position:
    absolute;

  top:
    11px;

  right:
    11px;

  z-index:
    5;

  display:flex;

  flex-direction:
    column;

  gap:
    7px;
}


.map-tool {

  min-height:
    43px;

  border:
    1px solid #dce0e5;

  border-radius:
    12px;

  background:
    rgba(255,255,255,.96);

  padding:
    0 11px;

  box-shadow:
    0 4px 14px rgba(0,0,0,.12);

  font-size:
    12px;

  font-weight:
    900;
}


/* =============================
   NAVIGATION
============================= */

.nav-panel {

  background:
    #ffffff;

  border-top:
    1px solid var(--line);

  padding:
    12px;
}


.nav-summary {

  display:flex;

  align-items:
    flex-end;

  justify-content:
    space-between;

  gap:
    10px;
}


.nav-time {

  font-size:
    25px;

  font-weight:
    950;
}


.nav-distance {

  color:
    var(--muted);

  font-size:
    13px;
}


.nav-actions {

  display:flex;

  gap:
    7px;

  flex-wrap:
    wrap;

  margin-top:
    10px;
}


.wide-btn {

  min-height:
    44px;

  border:
    1px solid #d8dce1;

  border-radius:
    12px;

  background:
    #ffffff;

  padding:
    0 13px;

  font-weight:
    900;
}


.wide-btn.primary {

  background:
    var(--accent);

  color:
    #ffffff;

  border-color:
    var(--accent);
}


/* =============================
   STOP LIST
============================= */

.stop-list {

  margin-top:
    10px;

  display:grid;

  gap:
    7px;
}


.stop-row {

  display:grid;

  grid-template-columns:
    34px minmax(0,1fr) auto;

  gap:
    8px;

  align-items:
    center;

  padding:
    9px;

  border:
    1px solid var(--line);

  border-radius:
    13px;

  background:
    #ffffff;
}


.stop-num {

  width:
    30px;

  height:
    30px;

  display:grid;

  place-items:
    center;

  border-radius:
    50%;

  background:
    #151515;

  color:
    #ffffff;

  font-size:
    12px;

  font-weight:
    900;
}


.stop-name {

  font-size:
    13px;

  font-weight:
    900;

  overflow:
    hidden;

  text-overflow:
    ellipsis;

  white-space:
    nowrap;
}


.stop-sub {

  margin-top:
    2px;

  color:
    var(--muted);

  font-size:
    11px;

  overflow:
    hidden;

  text-overflow:
    ellipsis;

  white-space:
    nowrap;
}


.stop-actions {

  display:flex;

  gap:
    4px;
}


.icon-btn {

  width:
    31px;

  height:
    31px;

  border:
    1px solid #dcdfe4;

  border-radius:
    9px;

  background:
    #ffffff;

  font-weight:
    900;
}


.empty {

  padding:
    22px 12px;

  border:
    1px dashed #ccd0d6;

  border-radius:
    14px;

  color:
    var(--muted);

  font-size:
    13px;

  text-align:
    center;
}


/* =============================
   MAP MARKER
============================= */

.place-marker {

  width:
    34px;

  height:
    34px;

  display:grid;

  place-items:
    center;

  border-radius:
    18px 18px 18px 5px;

  transform:
    rotate(-45deg);

  border:
    3px solid #ffffff;

  box-shadow:
    0 3px 11px rgba(0,0,0,.28);
}


.place-marker span {

  transform:
    rotate(45deg);

  color:
    #ffffff;

  font-size:
    12px;

  font-weight:
    950;
}


.me-marker {

  width:
    22px;

  height:
    22px;

  border-radius:
    50%;

  background:
    #3478f6;

  border:
    4px solid #ffffff;

  box-shadow:
    0 0 0 5px rgba(52,120,246,.2),
    0 3px 9px rgba(0,0,0,.25);
}


.fav-marker {

  width:
    34px;

  height:
    34px;

  display:grid;

  place-items:
    center;

  border-radius:
    50%;

  border:
    3px solid #ffffff;

  box-shadow:
    0 3px 10px rgba(0,0,0,.22);

  font-size:
    16px;
}


/* =============================
   FAVORITE
============================= */

.favorite-card {

  padding:
    11px 0;

  border-bottom:
    1px solid var(--line);
}


.favorite-card:last-child {
  border-bottom:0;
}


.favorite-name {

  font-size:
    14px;

  font-weight:
    900;
}


.tag {

  display:inline-block;

  margin-top:
    5px;

  padding:
    4px 8px;

  border-radius:
    999px;

  background:
    #f1f3f5;

  color:
    #555;

  font-size:
    11px;

  font-weight:
    800;
}


/* =============================
   BOTTOM NAV
============================= */

.bottom-nav {

  position:
    fixed;

  left:
    0;

  right:
    0;

  bottom:
    0;

  z-index:
    50;

  height:
    66px;

  padding-bottom:
    env(safe-area-inset-bottom);

  background:
    rgba(255,255,255,.97);

  border-top:
    1px solid var(--line);

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  backdrop-filter:
    blur(14px);
}


.nav-btn {

  border:
    0;

  background:
    transparent;

  color:
    #858991;

  font-size:
    11px;

  font-weight:
    800;
}


.nav-btn span {

  display:block;

  font-size:
    20px;

  margin-bottom:
    2px;
}


.nav-btn.active {

  color:
    #111111;
}


@media (min-width:820px) {

  .app {

    max-width:
      1100px;

    margin:
      auto;
  }


  .map-wrap {

    height:
      650px;
  }


  .bottom-nav {

    left:
      50%;

    transform:
      translateX(-50%);

    max-width:
      720px;

    border-left:
      1px solid var(--line);

    border-right:
      1px solid var(--line);

    border-radius:
      16px 16px 0 0;
  }
}

</style>

</head>


<body>


<div class="app">


<header class="topbar">

  <h1>
    🇯🇵 후쿠오카 여행
  </h1>

  <p>
    검색부터 실제 길찾기까지 이 화면 안에서
  </p>

</header>



<main>


<!-- ================================
     HOME
================================ -->

<section
  id="homeView"
  class="view active"
>


<div class="page">


<div class="hero">

  <div class="eyebrow">
    FUKUOKA TRIP
  </div>


  <h2>
    오늘은 어디로<br>
    가볼까? 🇯🇵
  </h2>


  <p>
    장소를 검색하고 바로 길찾기하거나 일정에 넣어봐.
  </p>


  <div class="quick-grid">


    <button
      class="quick-btn"
      data-go="map"
    >

      <span>
        🔎
      </span>

      <b>
        장소 찾기
      </b>

    </button>


    <button
      class="quick-btn"
      data-go="schedule"
    >

      <span>
        🗓️
      </span>

      <b>
        일정 보기
      </b>

    </button>


    <button
      class="quick-btn"
      data-go="favorites"
    >

      <span>
        ❤️
      </span>

      <b>
        찜한 장소
      </b>

    </button>


    <button
      class="quick-btn"
      id="homeLocationBtn"
    >

      <span>
        📍
      </span>

      <b>
        현재 위치 보기
      </b>

    </button>


  </div>

</div>



<div
  class="card"
  style="margin-top:10px;"
>

  <div class="section-title">
    여행 날짜
  </div>

  <div
    class="day-tabs"
    data-day-tabs
  ></div>

</div>



<div class="card">

  <div class="section-title">
    선택한 날 일정
  </div>

  <div id="homeSchedule"></div>

</div>


</div>

</section>



<!-- ================================
     MAP
================================ -->

<section
  id="mapView"
  class="view"
>


<div class="search-box">


<div class="search-row">

  <input
    id="searchInput"
    type="search"
    placeholder="이치란, 캐널시티, 다자이후..."
    autocomplete="off"
  >

  <button
    id="searchBtn"
    class="search-btn"
    type="button"
  >
    검색
  </button>

</div>



<div class="search-tools">


<select
  id="categorySelect"
  class="category-select"
>

  <option value="restaurant">
    🍜 맛집
  </option>

  <option value="cafe">
    ☕ 카페
  </option>

  <option value="shopping">
    🛍️ 쇼핑
  </option>

  <option value="tour">
    📸 관광
  </option>

  <option value="hotel">
    🏨 숙소
  </option>

  <option value="etc">
    📍 기타
  </option>

</select>



<div
  class="mode-tabs"
  id="mapModeTabs"
>

  <button
    class="mode-btn active"
    data-mode="walking"
  >
    🚶 도보
  </button>


  <button
    class="mode-btn"
    data-mode="driving"
  >
    🚗 자동차
  </button>


  <button
    class="mode-btn"
    data-mode="cycling"
  >
    🚲 자전거
  </button>

</div>


</div>

</div>



<div
  id="searchStatus"
  class="status"
></div>



<div
  id="searchResults"
  class="search-results"
></div>



<div class="map-wrap">

  <div id="map"></div>


  <div class="map-tools">

    <button
      id="myLocationBtn"
      class="map-tool"
      type="button"
    >
      📍 내 위치
    </button>


    <button
      id="refreshRouteBtn"
      class="map-tool"
      type="button"
    >
      🔄 경로 갱신
    </button>


    <button
      id="fitRouteBtn"
      class="map-tool"
      type="button"
    >
      🧭 경로 전체
    </button>

  </div>

</div>



<div class="nav-panel">


<div class="nav-summary">

  <div>

    <div class="muted">
      현재 길찾기
    </div>

    <div
      id="routeTime"
      class="nav-time"
    >
      경로 없음
    </div>

  </div>


  <div
    id="routeDistance"
    class="nav-distance"
  ></div>

</div>



<div
  id="routeMessage"
  class="muted"
  style="margin-top:6px;"
>
  검색 결과에서 ‘여기로 길찾기’를 눌러줘.
</div>



<div
  id="navStops"
  class="stop-list"
></div>



<div class="nav-actions">


<button
  id="clearNavBtn"
  class="wide-btn"
  type="button"
>
  경로 종료
</button>


<button
  id="addNavToScheduleBtn"
  class="wide-btn"
  type="button"
>
  현재 경로를 일정에 추가
</button>


</div>


</div>

</section>



<!-- ================================
     SCHEDULE
================================ -->

<section
  id="scheduleView"
  class="view"
>


<div class="page">


<div class="card">

  <div class="section-title">
    여행 일정
  </div>

  <div
    class="day-tabs"
    data-day-tabs
  ></div>

</div>



<div class="card">

  <div class="section-title">
    방문 순서
  </div>


  <div id="scheduleList"></div>


  <div
    class="result-actions"
    style="margin-top:12px;"
  >


    <button
      id="scheduleRouteBtn"
      class="small-btn primary"
      type="button"
    >
      📍 현재 위치부터 전체 길찾기
    </button>


    <button
      id="scheduleMapBtn"
      class="small-btn"
      type="button"
    >
      🗺️ 지도에서 보기
    </button>


  </div>

</div>


</div>

</section>



<!-- ================================
     FAVORITES
================================ -->

<section
  id="favoritesView"
  class="view"
>


<div class="page">


<div class="card">

  <div class="section-title">
    ❤️ 찜한 장소
  </div>

  <div id="favoriteList"></div>

</div>


</div>

</section>



</main>

</div>



<!-- ================================
     BOTTOM NAV
================================ -->

<nav class="bottom-nav">


<button
  class="nav-btn active"
  data-view="home"
>

  <span>
    🏠
  </span>

  홈

</button>


<button
  class="nav-btn"
  data-view="map"
>

  <span>
    🗺️
  </span>

  지도

</button>


<button
  class="nav-btn"
  data-view="schedule"
>

  <span>
    🗓️
  </span>

  일정

</button>


<button
  class="nav-btn"
  data-view="favorites"
>

  <span>
    ❤️
  </span>

  찜

</button>


</nav>



<script>

(() => {


const WORKER_BASE =
  "https://orange-recipe-d340fukuoka-route.wnals4836.workers.dev";


const STORAGE_KEY =
  "fukuoka-trip-v6";



const categoryInfo = {

  restaurant:{
    label:"맛집",

function clone(obj) {

  return JSON.parse(
    JSON.stringify(obj)
  );
}



function loadState() {

  try {

    const saved =
      JSON.parse(
        localStorage.getItem(
          STORAGE_KEY
        ) || "null"
      );


    if (!saved) {

      return clone(
        defaultState
      );
    }


    return {

      ...clone(
        defaultState
      ),

      ...saved,

      days:{
        ...clone(
          defaultState.days
        ),

        ...(saved.days || {})
      },

      favorites:
        Array.isArray(
          saved.favorites
        )
        ?
        saved.favorites
        :
        [],

      navStops:
        Array.isArray(
          saved.navStops
        )
        ?
        saved.navStops
        :
        []

    };

  }

  catch {

    return clone(
      defaultState
    );
  }
}



function saveState() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );
}



function currentSchedule() {

  return (
    state.days[
      state.selectedDay
    ] ||
    []
  );
}



function dayLabel(day) {

  if (day === "day1") {
    return "1일차";
  }

  if (day === "day2") {
    return "2일차";
  }

  return "3일차";
}



function makeId() {

  return (
    crypto.randomUUID
    ?
    crypto.randomUUID()
    :
    Date.now() +
    "-" +
    Math.random()
  );
}



function esc(value) {

  return String(
    value ?? ""
  )
  .replace(
    /[&<>"']/g,

    char => ({

      "&":"&amp;",

      "<":"&lt;",

      ">":"&gt;",

      '"':"&quot;",

      "'":"&#039;"

    })[char]
  );
}



function samePlace(a,b) {

  return (

    Math.abs(
      Number(a.lat) -
      Number(b.lat)
    )
    <
    0.00002

    &&

    Math.abs(
      Number(a.lng) -
      Number(b.lng)
    )
    <
    0.00002
  );
}



function formatDistance(meters) {

  if (meters >= 1000) {

    return (
      meters / 1000
    )
    .toFixed(
      meters >= 10000
      ?
      0
      :
      1
    )
    +
    "km";
  }


  return (
    Math.round(meters) +
    "m"
  );
}



function formatDuration(seconds) {

  const minutes =
    Math.round(
      seconds / 60
    );


  if (minutes < 60) {

    return (
      minutes +
      "분"
    );
  }


  const hours =
    Math.floor(
      minutes / 60
    );


  const remain =
    minutes % 60;


  return (
    remain
    ?
    `${hours}시간 ${remain}분`
    :
    `${hours}시간`
  );
}



function showStatus(
  text,
  error=false
) {

  const el =

  el.classList.toggle(

  el.classList.toggle(
    "error",
    Boolean(text) &&
    error
  );
}

function setMyLocationMarker(

    })

    .setLngLat([
      location.lng,
      location.lat
    ])

    .setPopup(

      new maplibregl.Popup({

      .setHTML(

      )

      center:[

      essential:

    });
  }
}



function getCurrentLocation(
  force=false
) {

  if (
    currentLocation &&
    !force
  ) {

    return Promise.resolve(
      currentLocation
    );
  }


  if (
    !navigator.geolocation
  ) {

    return Promise.reject(
      new Error(
        "이 기기에서는 위치 기능을 사용할 수 없어."
      )
    );
  }


  return new Promise(
    (
      resolve,
      reject
    ) => {

      navigator.geolocation
      .getCurrentPosition(

        position => {

          currentLocation = {

            lat:
              position.coords.latitude,

            lng:
              position.coords.longitude
          };


          setMyLocationMarker(
            currentLocation,
            false
          );


          resolve(
            currentLocation
          );

        },

        error => {

          reject(
            new Error(

              error.code === 1
              ?
              "브라우저에서 위치 권한을 허용해줘."
              :
              "현재 위치를 가져오지 못했어."

            )
          );

        },

        {

          enableHighAccuracy:
            true,

          timeout:
            12000,

          maximumAge:
            10000

        }

      );

    }
  );
}

async function searchPlaces() {

  const input =
    document.getElementById(
      "searchInput"
    );


  const query =
    input.value.trim();


  if (!query) {

    showStatus(
      "검색어를 입력해줘.",
      true
    );

    input.focus();

    return;
  }


  if (searchController) {

    searchController.abort();
  }


  searchController =
    new AbortController();


  const button =
    document.getElementById(
      "searchBtn"
    );


  button.disabled =
    true;


  button.textContent =
    "검색중";


  showStatus(
    "후쿠오카 주변 장소를 찾는 중..."
  );


  document
  .getElementById(
    "searchResults"
  )
  .classList
  .remove(
    "show"
  );


  try {

    const response =
      await fetch(

        `${WORKER_BASE}/search?q=${encodeURIComponent(query)}`,

        {
          signal:
            searchController.signal
        }

      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        `검색 오류 (${response.status})`
      );
    }


    renderSearchResults(
      data.features ||
      []
    );

  }

  catch (error) {

    if (
      error.name !==
      "AbortError"
    ) {

      showStatus(
        `검색 실패: ${error.message}`,
        true
      );
    }

  }

  finally {

    button.disabled =
      false;


    button.textContent =
      "검색";
  }
}



function featureToPlace(
  feature
) {

  const properties =
    feature.properties ||
    {};


  const coordinates =
    feature.geometry
    ?.coordinates ||
    [];


  return {

    id:
      makeId(),

    name:
      properties.name ||
      properties.label ||
      "검색 장소",

    address:
      properties.label ||
      [
        properties.locality,
        properties.region,
        properties.country
      ]
      .filter(Boolean)
      .join(", "),

    lat:
      Number(
        coordinates[1]
      ),

    lng:
      Number(
        coordinates[0]
      ),

    category:
      document
      .getElementById(
        "categorySelect"
      )
      .value

  };
}

async function calculateRoute(
  forceLocation=false
) {

  if (
    !state.navStops.length
  ) {

    setRouteSummary(

      null,

      "검색 결과에서 ‘여기로 길찾기’를 눌러줘."

    );


    clearRouteLine();

    return;
  }


  setRouteSummary(

    "계산 중...",

    "현재 위치에서 실제 도로 경로를 계산하고 있어."

  );


  try {


    const location =
      await getCurrentLocation(
        forceLocation
      );


    const coordinates = [

      [
        location.lng,
        location.lat
      ],

      ...state.navStops
      .map(
        place => [
          place.lng,
          place.lat
        ]
      )

    ];


    const response =
      await fetch(
        `${WORKER_BASE}/route`,
        {

          method:
            "POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              profile:
                state.routeMode,

              coordinates:
                coordinates

            })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        data.message ||
        `길찾기 오류 (${response.status})`
      );
    }


    lastRouteGeoJSON =
      data;


    lastRouteSegments =

      data.features?.[0]
      ?.properties
      ?.segments

      ||

      [];


    drawRoute(
      data
    );


    renderNavStops();


    const summary =

      data.features?.[0]
      ?.properties
      ?.summary;


    if (summary) {


      document
      .getElementById(
        "routeTime"
      )
      .textContent =
        formatDuration(
          summary.duration
        );


      document
      .getElementById(
        "routeDistance"
      )
      .textContent =
        formatDistance(
          summary.distance
        );


      document
      .getElementById(
        "routeMessage"
      )
      .textContent =

        `${modeLabel(state.routeMode)} · 현재 위치 → ${state.navStops[state.navStops.length-1].name}`;

    }

    else {

      setRouteSummary(

        "경로 완료",

        `${modeLabel(state.routeMode)} 경로를 지도에 표시했어.`

      );
    }


    refreshMapMarkers();

  }

  catch (error) {

    setRouteSummary(

      "길찾기 실패",

      error.message

    );


    alert(
      error.message
    );
  }
}



function modeLabel(mode) {

  if (
    mode === "walking"
  ) {

    return "🚶 도보";
  }


  if (
    mode === "driving"
  ) {

    return "🚗 자동차";
  }


  return "🚲 자전거";
}



function setRouteSummary(
  title,
  message
) {

  document
  .getElementById(
    "routeTime"
  )
  .textContent =
    title ||
    "경로 없음";


  document
  .getElementById(
    "routeDistance"
  )
  .textContent =
    "";


  document
  .getElementById(
    "routeMessage"
  )
  .textContent =
    message ||
    "";
}



function drawRoute(
  geojson
) {

  if (
    !mapReady ||
    !map.getSource(
      "route"
    )
  ) {

    return;
  }


  map
  .getSource(
    "route"
  )
  .setData(
    geojson
  );


  const coordinates =

    geojson.features?.[0]
    ?.geometry
    ?.coordinates

    ||

    [];


  if (
    !coordinates.length
  ) {

    return;
  }


  const bounds =
    new maplibregl
    .LngLatBounds();


  coordinates.forEach(
    coordinate =>
      bounds.extend(
        coordinate
      )
  );


  map.fitBounds(
    bounds,
    {

      padding:
        55,

      maxZoom:
        16,

      duration:
        700

    }
  );
}



function clearRouteLine() {

  lastRouteGeoJSON =
    null;


  lastRouteSegments =
    [];


  if (
    mapReady &&
    map.getSource(
      "route"
    )
  ) {

    map
    .getSource(
      "route"
    )
    .setData({

      type:
        "FeatureCollection",

      features:[]

    });
  }
}

function renderNavStops() {

  const box =
    document.getElementById(
      "navStops"
    );


  if (
    !state.navStops.length
  ) {

    box.innerHTML =
      "";

    return;
  }


  box.innerHTML =
    "";


  state.navStops
  .forEach(
    (place,index) => {


      const segment =
        lastRouteSegments[
          index
        ];


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "stop-row";


      row.innerHTML = `

        <div class="stop-num">

          ${index+1}

        </div>


        <div>

          <div class="stop-name">

            ${esc(place.name)}

          </div>


          <div class="stop-sub">

            ${
              segment
              ?
              `${formatDuration(segment.duration)} · ${formatDistance(segment.distance)}`
              :
              (
                index ===
                state.navStops.length-1
                ?
                "목적지"
                :
                "경유지"
              )
            }

          </div>

        </div>


        <div class="stop-actions">

          <button
            class="icon-btn up"
            type="button"
          >
            ↑
          </button>


          <button
            class="icon-btn down"
            type="button"
          >
            ↓
          </button>


          <button
            class="icon-btn remove"
            type="button"
          >
            ×
          </button>

        </div>

      `;


      row
      .querySelector(
        ".up"
      )
      .disabled =
        index === 0;


      row
      .querySelector(
        ".down"
      )
      .disabled =

        index ===
        state.navStops.length-1;


      row
      .querySelector(
        ".up"
      )
      .addEventListener(
        "click",
        () =>
          moveNavStop(
            index,
            -1
          )
      );


      row
      .querySelector(
        ".down"
      )
      .addEventListener(
        "click",
        () =>
          moveNavStop(
            index,
            1
          )
      );


      row
      .querySelector(
        ".remove"
      )
      .addEventListener(
        "click",
        () =>
          removeNavStop(
            index
          )
      );


      box.appendChild(
        row
      );

    }
  );
}



async function moveNavStop(
  index,
  delta
) {

  const target =
    index +
    delta;


  if (
    target < 0 ||
    target >=
    state.navStops.length
  ) {

    return;
  }


  [
    state.navStops[index],
    state.navStops[target]
  ]
  =
  [
    state.navStops[target],
    state.navStops[index]
  ];


  saveState();


  renderNavStops();


  refreshMapMarkers();


  await calculateRoute(
    false
  );
}



async function removeNavStop(
  index
) {

  state.navStops.splice(
    index,
    1
  );


  saveState();


  renderNavStops();


  refreshMapMarkers();


  if (
    state.navStops.length
  ) {

    await calculateRoute(
      false
    );
  }

  else {

    clearRouteLine();


    setRouteSummary(

      null,

      "검색 결과에서 ‘여기로 길찾기’를 눌러줘."

    );
  }
}



/* =====================================
   SCHEDULE
===================================== */

function addToSchedule(
  place
) {

  const schedule =
    currentSchedule();


  if (
    schedule.some(
      p =>
        samePlace(
          p,
          place
        )
    )
  ) {

    alert(
      "이미 이 날짜 일정에 들어있어."
    );

    return;
  }


  schedule.push({
    ...place,
    id:makeId()
  });


  saveState();


  renderEverything();


  alert(
    `${dayLabel(state.selectedDay)} 일정에 추가했어.`
  );
}



function addFavorite(
  place
) {

  if (
    state.favorites.some(
      p =>
        samePlace(
          p,
          place
        )
    )
  ) {

    alert(
      "이미 찜한 장소야."
    );

    return;
  }


  state.favorites.push({
    ...place,
    id:makeId()
  });


  saveState();


  renderEverything();


  alert(
    "찜에 추가했어. ❤️"
  );
}



function renderDayTabs() {

        ],

        ]

      ]

            document.createElement(

          button

function renderHome() {

    );

  ) {

          </div>


          <div>

            <div class="stop-name">

              ${
                categoryInfo[
                  place.category ||
                  "etc"
                ].emoji
              }

              ${esc(place.name)}

            </div>

              ${esc(place.address || "")}

            </div>

          </div>


          <div></div>

        </div>

      `

function renderSchedule() {

  const box =
    document.getElementById(
      "scheduleList"
    );


  const schedule =
    currentSchedule();


  if (
    !schedule.length
  ) {

    box.innerHTML = `

      <div class="empty">

        ${dayLabel(state.selectedDay)}
        일정이 비어있어.

      </div>

    `;

    return;
  }


  box.innerHTML =
    "";


  schedule.forEach(
    (place,index) => {


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "stop-row";


      row.innerHTML = `

        <div class="stop-num">

          ${index+1}

        </div>


        <div>

          <div class="stop-name">

            ${
              categoryInfo[
                place.category ||
                "etc"
              ].emoji
            }

            ${esc(place.name)}

          </div>


          <div class="stop-sub">

            ${esc(place.address || "")}

          </div>

        </div>


        <div class="stop-actions">

          <button
            class="icon-btn up"
          >
            ↑
          </button>


          <button
            class="icon-btn down"
          >
            ↓
          </button>


          <button
            class="icon-btn remove"
          >
            ×
          </button>

        </div>

      `;


      row
      .querySelector(
        ".up"
      )
      .disabled =
        index === 0;


      row
      .querySelector(
        ".down"
      )
      .disabled =

        index ===
        schedule.length-1;


      row
      .querySelector(
        ".up"
      )
      .addEventListener(
        "click",
        () =>
          moveSchedule(
            index,
            -1
          )
      );


      row
      .querySelector(
        ".down"
      )
      .addEventListener(
        "click",
        () =>
          moveSchedule(
            index,
            1
          )
      );


      row
      .querySelector(
        ".remove"
      )
      .addEventListener(
        "click",
        () => {

          schedule.splice(
            index,
            1
          );


          saveState();


          renderEverything();

        }
      );


      box.appendChild(
        row
      );

    }
  );
}



function moveSchedule(
  index,
  delta
) {

  const schedule =
    currentSchedule();


  const target =
    index +
    delta;


  if (
    target < 0 ||
    target >=
    schedule.length
  ) {

    return;
  }


  [
    schedule[index],
    schedule[target]
  ]
  =
  [
    schedule[target],
    schedule[index]
  ];


  saveState();


  renderEverything();
}

/* =====================================
   MODE BUTTON
===================================== */

function renderModeButtons() {

  document
  .querySelectorAll(
    "[data-mode]"

  .forEach(

/* =====================================
   RENDER ALL
===================================== */

function renderEverything() {

  renderDayTabs();

  renderHome();

  renderSchedule();

  renderFavorites();

  renderNavStops();

  renderModeButtons();


  if (mapReady) {

    refreshMapMarkers();
  }
}



/* =====================================
   VIEW
===================================== */

function changeView(view) {

  document
  .querySelectorAll(
    ".view"
  )
  .forEach(
    item =>
      item.classList
      .remove(
        "active"
      )
  );


  document
  .getElementById(
    view +
    "View"
  )
  .classList
  .add(
    "active"
  );


  document
  .querySelectorAll(
    ".nav-btn"
  )
  .forEach(
    button => {

      button.classList.toggle(

        "active",

        button.dataset.view ===
        view

      );

    }
  );


  if (
    view ===
    "map"
  ) {

    setTimeout(
      () => {

        map.resize();


        refreshMapMarkers();


        if (
          lastRouteGeoJSON
        ) {

          drawRoute(
            lastRouteGeoJSON
          );
        }

      },
      120
    );
  }


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}



function fitCurrentRoute() {

  if (
    lastRouteGeoJSON
  ) {

    drawRoute(
      lastRouteGeoJSON
    );

    return;
  }


  const points = [
    ...state.navStops
  ];


  if (
    currentLocation
  ) {

    points.unshift({
      lng:currentLocation.lng,
      lat:currentLocation.lat
    });
  }


  if (
    !points.length
  ) {

    return;
  }


  const bounds =
    new maplibregl
    .LngLatBounds();


  points.forEach(
    place =>
      bounds.extend(
        [
          place.lng,
          place.lat
        ]
      )
  );


  if (
    points.length === 1
  ) {

    map.flyTo({

      center:[
        points[0].lng,
        points[0].lat
      ],

      zoom:
        15.5

    });

  }

  else {

    map.fitBounds(
      bounds,
      {
        padding:60,
        maxZoom:15
      }
    );
  }
}
